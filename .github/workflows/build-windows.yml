name: Build Windows executable

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

      - name: Build with PyInstaller
        run: pyinstaller systemmon.spec

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SystemMon-windows
          path: dist/SystemMon

      - name: Zip build output
        run: Compress-Archive -Path dist/SystemMon/* -DestinationPath SystemMon-windows.zip

      # Workflow artifacts (above) require a logged-in GitHub session to
      # download, even on a public repo. Release assets don't, so this
      # publishes/replaces a rolling "latest build" release on every push,
      # giving a stable, truly public download link.
      - name: Publish rolling "latest build" release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete windows-latest --yes --cleanup-tag || true
          gh release create windows-latest SystemMon-windows.zip \
            --title "Latest Windows build" \
            --notes "Automatically built from commit ${{ github.sha }}. Not a versioned release - replaced on every push to main." \
            --prerelease
